; Polybar config. See https://github.com/polybar/polybar/wiki

[colors]
; #AARRGGBB, the alpha needs picom running to be see-through
background = #e601122b
foreground = #c0caf5
dim = #565f89
accent = #7aa2f7
good = #989898
degraded = #cc8100
bad = #be2422

[bar/main]
monitor = ${env:MONITOR:}
; Float the bar 8px in from the screen edges, matching i3's outer gaps.
; i3 ignores offsets on docks, so position it ourselves and let i3's
; `gaps top` reserve the space. wm-restack keeps it under fullscreen windows.
override-redirect = true
wm-restack = i3
width = 100%:-16
offset-x = 8
offset-y = 8
height = 28
line-size = 2
padding-left = 1
padding-right = 2
module-margin = 1

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2

modules-left = logo i3 xwindow
modules-right = pulseaudio temperature memory cpu wireless wired date tray

separator = │
separator-foreground = ${colors.dim}

cursor-click = pointer

[module/logo]
type = custom/text
format = 
format-foreground = ${colors.accent}
format-padding = 1

[module/i3]
type = internal/i3
pin-workspaces = true
enable-scroll = false

label-focused = %name%
label-focused-underline = ${colors.accent}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.bad}
label-urgent-padding = 1

label-mode = %mode%
label-mode-foreground = ${colors.degraded}
label-mode-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
label-muted = 󰖁 mute
label-muted-foreground = ${colors.bad}
click-right = pavucontrol

[module/temperature]
type = internal/temperature
; Set by launch.sh for this machine's CPU sensor
hwmon-path = ${env:CPU_TEMP:}
warn-temperature = 80
format = <label>
format-prefix = "󰔏 "
format-prefix-foreground = ${colors.accent}
format-warn = <label-warn>
format-warn-prefix = "󰔏 "
format-warn-prefix-foreground = ${colors.bad}
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.bad}

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 96
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.accent}
format-warn-prefix = "󰍛 "
format-warn-prefix-foreground = ${colors.degraded}
label = %gb_used%/%gb_total%
label-warn = %gb_free% left
label-warn-foreground = ${colors.degraded}

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 90
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.accent}
format-warn-prefix = "󰻠 "
format-warn-prefix-foreground = ${colors.degraded}
label = %percentage:2%%
label-warn = %percentage:2%%
label-warn-foreground = ${colors.degraded}

[module/wireless]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
format-disconnected = <label-disconnected>
label-disconnected = 󰤮 down
label-disconnected-foreground = ${colors.bad}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.accent}

[module/wired]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %linkspeed%
; Hidden when unplugged
format-disconnected =

[module/date]
type = internal/date
interval = 1
time = %H:%M:%S
date = %d/%m/%Y
label = %{F#7aa2f7}󰥔%{F-} %{T2}%time%%{T-}  %{F#7aa2f7}󰃭%{F-} %date%

[module/tray]
type = internal/tray
tray-spacing = 8px

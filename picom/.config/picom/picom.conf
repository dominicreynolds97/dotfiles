backend = "glx";
vsync = true;

corner-radius = 18;

# Soft blur behind anything translucent
blur: {
  method = "dual_kawase";
  strength = 2;
};

rules = (
  # Fade windows that aren't focused
  { match = "window_type = 'normal' && !focused"; opacity = 0.85; },
  # Rofi sets its own translucency, don't fade it further
  { match = "class_g = 'Rofi'"; opacity = 1; },
  # Corner radius for the bar
  { match = "window_type = 'dock'"; corner-radius = 12; },
  { match = "fullscreen"; corner-radius = 0; },
  # Don't blur the screenshot selection overlay
  { match = "class_g = 'slop'"; blur-background = false; },
  # The lock screen must hide everything beneath it
  { match = "class_g = 'i3lock'"; opacity = 1; corner-radius = 0; blur-background = false; },
);
